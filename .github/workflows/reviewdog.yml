name: reviewdog
on: [pull_request]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reviewdog
        uses: jonsoku-dev/reviewdog-all@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          workdir: "."
          level: info 
          filter_mode: file
          fail_level: none
          eslint_flags: "**/*.{js,jsx,ts,tsx}"
          stylelint_input: "**/*.css"
          markdownlint_flags: "**/*.md"