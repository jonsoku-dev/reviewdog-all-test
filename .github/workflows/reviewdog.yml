name: reviewdog
on: [pull_request]

jobs:
  reviewdog:
    name: reviewdog
    runs-on: ubuntu-latest
    permissions:
        contents: read      # 코드를 읽기 위한 권한
        pull-requests: write # PR에 코멘트를 달기 위한 권한
    steps:
      - uses: actions/checkout@v4
      - name: reviewdog
        uses: jonsoku-dev/reviewdog-all@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          workdir: "."
          level: info 
          filter_mode: file
          fail_level: none
          eslint_flags: "**/*.{js,jsx,ts,tsx}"
          stylelint_input: "**/*.css"
          markdownlint_flags: "**/*.md"