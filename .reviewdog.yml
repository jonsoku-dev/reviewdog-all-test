runner:
  golangci-lint:
    cmd: golangci-lint run --out-format=line-number
    errorformat:
      - '%E%f:%l:%c: %m'
      - '%E%f:%l: %m'
      - '%C%.%#'
    level: warning
    format: golangci-lint
    workdir: "."

  eslint:
    cmd: eslint --format stylish --stdin
    errorformat:
      - '%E%f:%l:%c: %m'
      - '%E%f:%l: %m'
      - '%C%.%#'
    level: warning
    format: eslint
    workdir: "."

  stylelint:
    cmd: stylelint --formatter string
    errorformat:
      - '%E%f:%l:%c: %m'
      - '%E%f:%l: %m'
      - '%C%.%#'
    level: warning
    format: stylelint
    workdir: "."

  shellcheck:
    cmd: shellcheck -f gcc
    errorformat:
      - '%f:%l:%c: %m'
    level: warning
    format: shellcheck
    workdir: "."

  hadolint:
    cmd: hadolint -
    errorformat:
      - '%f:%l %m'
    level: warning
    format: hadolint
    workdir: "."

  markdownlint:
    cmd: markdownlint
    errorformat:
      - '%f:%l %m'
    level: warning
    format: markdownlint
    workdir: "." 